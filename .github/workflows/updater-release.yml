name: Updater release

# Pushing a tag like "updater-v1.2.3" tests and builds LethalAccessUpdater.exe
# and publishes it as a GitHub release. Installed updaters find the newer
# release on their next run and replace themselves.

on:
  push:
    tags: ["updater-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: installer/go.mod
          cache-dependency-path: installer/go.sum

      - name: Test
        working-directory: installer
        run: |
          go vet ./...
          go test ./...

      - name: Build
        working-directory: installer
        run: |
          $version = "${{ github.ref_name }}".Substring("updater-v".Length)
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "../dist/LethalAccessUpdater.exe" ./cmd/updater

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag on a commit that isn't on master is a Beta updater, published
          # as a pre-release. Only installs following Beta builds pick it up.
          git merge-base --is-ancestor "${{ github.sha }}" origin/master
          if ($LASTEXITCODE -eq 0) {
            gh release create "${{ github.ref_name }}" "dist/LethalAccessUpdater.exe" LICENSE THIRD-PARTY-NOTICES.txt `
              --title "LethalAccess Updater ${{ github.ref_name }}" --generate-notes
          } else {
            gh release create "${{ github.ref_name }}" "dist/LethalAccessUpdater.exe" LICENSE THIRD-PARTY-NOTICES.txt --prerelease `
              --title "LethalAccess Updater ${{ github.ref_name }} (Beta)" --generate-notes
          }
